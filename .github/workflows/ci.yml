name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-service:
    name: core service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core/requirements-dev.txt
      - run: pip install -r requirements-dev.txt ruff mypy
      - name: Lint
        run: |
          ruff check .
          mypy core_service --ignore-missing-imports
      - name: Test
        run: python -m pytest --cov=core_service --cov-report=term-missing

  conversation-service:
    name: conversation service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/conversation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/conversation/requirements-dev.txt
            services/core/requirements-dev.txt
      - run: pip install -r requirements-dev.txt -r ../core/requirements-dev.txt ruff mypy
      - name: Lint
        run: |
          ruff check .
          mypy conversation_service --ignore-missing-imports
      - name: Test
        # The conversation tests drive the real core app in-process, so no services
        # need to be running.
        run: PYTHONPATH=.:../core python -m pytest

  platform-services:
    name: crm · offermart · mcp · agents
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports: ["5432:5432"]
        volumes:
          - /tmp/tatabot-pg-drill:/tmp/tatabot-pg-drill
        env:
          POSTGRES_PASSWORD: pilot_ci_only
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: pilot_ci_only
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r services/core/requirements-dev.txt -r services/conversation/requirements-dev.txt -r services/mock-crm/requirements.txt -r services/mock-offermart/requirements.txt -r services/mcp-server/requirements.txt -r services/agents/requirements.txt ruff mypy
      - name: Lint
        run: |
          ruff check services/mock-crm services/mock-offermart services/mcp-server services/agents
          mypy services/agents/agents services/mcp-server/mcp_server --ignore-missing-imports
      - name: MockCRM
        run: cd services/mock-crm && python -m pytest
      - name: OfferMart
        run: cd services/mock-offermart && python -m pytest
      - name: MCP tool server
        run: cd services/mcp-server && python -m pytest
      - name: Agent graph (includes the end-to-end flow)
        run: cd services/agents && python -m pytest

      - name: Verified enrollment through underwriter approval
        run: |
          python -m pytest scripts/test_release.py
          npm ci --prefix apps/web
          pip install playwright==1.65.2
          python -m playwright install --with-deps chromium
          python scripts/demo_lab/run.py --browser
      - name: PostgreSQL migrations, reviewed application and restore
        run: |
          # Run PostgreSQL tools from the server image. Only the disposable lab directory is shared.
          export TMPDIR=/tmp/tatabot-pg-drill
          sudo chown "$(id -u):$(id -g)" "$TMPDIR"
          mkdir -p "$RUNNER_TEMP/pg-tools"
          for tool in createdb dropdb pg_dump pg_restore; do
            cat > "$RUNNER_TEMP/pg-tools/$tool" <<'SH'
          #!/bin/sh
          exec docker exec -e PGUSER -e PGPASSWORD -e PGHOST=127.0.0.1 "$PG_CONTAINER" "$(basename "$0")" "$@"
          SH
            chmod +x "$RUNNER_TEMP/pg-tools/$tool"
          done
          export PATH="$RUNNER_TEMP/pg-tools:$PATH"
          export PG_CONTAINER="${{ job.services.postgres.id }}"
          createdb pilot_core
          createdb pilot_conversation
          python scripts/demo_lab/run.py --postgres

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development)$'; then
            echo "A .env file is committed. Remove it and rotate the secret."
            exit 1
          fi
