name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-service:
    name: core service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/core/requirements-dev.txt
      - run: pip install -r requirements-dev.txt ruff mypy
      - name: Lint
        run: |
          ruff check .
          mypy core_service --ignore-missing-imports
      - name: Test
        run: python -m pytest --cov=core_service --cov-report=term-missing

  conversation-service:
    name: conversation service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/conversation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            services/conversation/requirements-dev.txt
            services/core/requirements-dev.txt
      - run: pip install -r requirements-dev.txt -r ../core/requirements-dev.txt ruff mypy
      - name: Lint
        run: |
          ruff check .
          mypy conversation_service --ignore-missing-imports
      - name: Test
        # The conversation tests drive the real core app in-process, so no services
        # need to be running.
        run: PYTHONPATH=.:../core python -m pytest

  platform-services:
    name: crm · offermart · mcp · agents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -r services/core/requirements-dev.txt
          pip install -r services/mock-crm/requirements.txt
          pip install -r services/mock-offermart/requirements.txt
          pip install -r services/mcp-server/requirements.txt
          pip install -r services/agents/requirements.txt
          pip install ruff mypy anyio
      - name: Lint
        run: |
          ruff check services/mock-crm services/mock-offermart services/mcp-server services/agents
          mypy services/agents/agents services/mcp-server/mcp_server --ignore-missing-imports
      - name: MockCRM
        run: cd services/mock-crm && python -m pytest
      - name: OfferMart
        run: cd services/mock-offermart && python -m pytest
      - name: MCP tool server
        run: cd services/mcp-server && python -m pytest
      - name: Agent graph (includes the end-to-end flow)
        run: cd services/agents && python -m pytest

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fail on committed .env files
        run: |
          if git ls-files | grep -E '(^|/)\.env$|(^|/)\.env\.(local|production|development)$'; then
            echo "A .env file is committed. Remove it and rotate the secret."
            exit 1
          fi
