# Single origin for the browser: static SPA plus the two services.
# Keeping everything on one hostname removes the CORS surface entirely.

upstream core_service {
    server core:8000;
}

upstream conversation_service {
    server conversation:8001;
}

server {
    listen 8080;
    server_name _;
    client_max_body_size 6m;

    # Baseline hardening. TLS terminates at the load balancer in front of this.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    # --- core lending service -------------------------------------------
    location ~ ^/(auth|v1|download)/ {
        proxy_pass http://core_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Operational endpoints stay internal: not routed from the public host.
    location ~ ^/(health|ready|metrics|internal)/ {
        return 404;
    }

    # --- conversation service -------------------------------------------
    location ~ ^/(chat|sessions)/ {
        proxy_pass http://conversation_service;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # --- SPA -------------------------------------------------------------
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    location ~* \.(?:js|css|woff2?|png|jpg|svg)$ {
        root /usr/share/nginx/html;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
